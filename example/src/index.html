<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
    <head>
        <meta charset="UTF-8" />
        <title>Example Using the Audio Plugin</title>
        <meta
            name="viewport"
            content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="format-detection" content="telephone=no" />
        <link href="./styles.css" rel="stylesheet" />
    </head>
    <body class="container px-4 mx-auto font-sans bg-slate-100">
        <main>
            <h1 class="text-2xl font-medium text-center mt-14">Native Queue Player Example</h1>
            <div class="mt-4 text-center">
                <div class="flex flex-col items-center space-y-2">
                    <div class="flex flex-wrap gap-2 justify-center">
                        <button id="loadAudiobookQueue" class="btn bg-slate-800 text-white">
                            Load Audiobook Queue
                        </button>
                        <button id="loadPodcastQueue" class="btn bg-slate-800 text-white">
                            Load Podcast Queue
                        </button>
                        <button id="patchSyncButton" class="btn bg-slate-800 text-white">
                            Patch Sync
                        </button>
                        <button id="patchSyncMismatchButton" class="btn bg-slate-800 text-white">
                            Patch Sync (mismatch)
                        </button>
                        <button id="resyncButton" class="btn bg-slate-600 text-white">Resync</button>
                        <button id="clearQueueButton" class="btn bg-red-600 text-white">
                            Clear Queue
                        </button>
                    </div>

                    <div class="flex flex-wrap gap-2 justify-center mt-2">
                        <button id="prevButton" class="btn bg-slate-300 text-slate-900">Prev</button>
                        <button id="playButton" class="btn bg-green-600 text-white">Play</button>
                        <button id="pauseButton" class="btn bg-yellow-600 text-white">Pause</button>
                        <button id="stopButton" class="btn bg-blue-600 text-white">Stop</button>
                        <button id="nextButton" class="btn bg-slate-300 text-slate-900">Next</button>
                    </div>

                    <div class="flex flex-wrap gap-2 justify-center mt-2">
                        <button id="addItemButton" class="btn btn-sm bg-blue-300 text-slate-900">
                            Add Item (to end)
                        </button>
                        <button id="removeCurrentButton" class="btn btn-sm bg-blue-300 text-slate-900">
                            Remove Current Item
                        </button>
                        <button id="moveLastToFirstButton" class="btn btn-sm bg-blue-300 text-slate-900">
                            Move Last → First
                        </button>
                        <button id="repeatButton" class="btn btn-sm bg-blue-300 text-slate-900">
                            Repeat: off
                        </button>
                        <button id="shuffleButton" class="btn btn-sm bg-blue-300 text-slate-900">
                            Shuffle: off
                        </button>
                    </div>
                </div>

                <div class="mt-6 text-left max-w-xl mx-auto bg-white rounded-xl shadow p-4">
                    <p><b>Status</b>: <span id="status">stopped</span></p>
                    <p><b>stateRevision</b>: <span id="stateRevision">0</span></p>
                    <p><b>queueRevision</b>: <span id="queueRevision">0</span></p>
                    <p><b>currentIndex</b>: <span id="currentIndex">0</span></p>
                    <p><b>currentItemId</b>: <span id="currentItemId">-</span></p>
                    <p><b>position</b>: <span id="position">0</span></p>
                    <p><b>duration</b>: <span id="duration">-</span></p>
                    <p><b>rate</b>: <span id="rate">1</span></p>
                    <p><b>volume</b>: <span id="volume">100</span></p>
                </div>

                <p id="error" class="text-red-500 mt-4"></p>
            </div>
        </main>
        <footer class="text-xs mt-4 text-center text-slate-600">
            <div>
                Events may not deliver while backgrounded; use <b>Resync</b> (or app resume) to reconcile.
            </div>
        </footer>
        <script src="./js/example.ts" type="module"></script>
    </body>
</html>
